[project]
name = "recipe-builder-api"
version = "0.1.0"
description = "Recipe Builder MVP - FastAPI backend for recipe management and costing"
readme = "README.md"
# >=3.12 because passport-client (below) declares requires-python >=3.12. Keep these in step:
# a lower floor here makes pip's resolver thrash to ResolutionTooDeep rather than name the conflict.
requires-python = ">=3.12"
dependencies = [
    # PINNED, not floored. The default-deny gate (app.api.deps.require_auth) matches the request
    # path against an allowlist, and how FastAPI reports that path changed inside the range this
    # previously allowed: up to ~0.109 `include_router` rewrote child routes with the mounted
    # prefix, so `scope["route"].path` was the full path; from ~0.139 it appends an
    # `_IncludedRouter` wrapper and routes keep their RELATIVE path. `require_auth` uses
    # `request.url.path`, which is correct on both — but `app.routes` also stops yielding real
    # routes, which silently guts the auth test. A floor here means `pip install -U` can change
    # auth behaviour; the failure mode is that login 401s and nobody can sign in.
    "fastapi==0.139.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.14",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.0.0",
    "httpx>=0.26.0",
    "anthropic>=0.48.0",
    "PyJWT[crypto]>=2.10.0",
    "ebb-flow-tech-auth @ git+https://github.com/missiongroupsystems/auth.git@v0.1.0#subdirectory=python",
    # Passport sync-consumer SDK — PRIVATE, not on PyPI. Installed like the auth dep above.
    # STAGING BRANCH = prerelease channel: Renovate tracks the newest tag INCLUDING rcN. The
    # current newest on that channel is the stable 1.1.0 (pep440: 1.1.0 supersedes 1.1.0rc), which
    # is also what `main` pins. Ref is monorepo-scoped so future *service* tags don't collide.
    "passport-client[fastapi] @ git+https://github.com/missiongroupsystems/passport.git@passport-client-v1.1.0#subdirectory=packages/passport-client/python",
    "cachetools>=5.3.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
